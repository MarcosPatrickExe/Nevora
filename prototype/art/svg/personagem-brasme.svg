<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="turbulence" baseFrequency="0.014" numOctaves="3" seed="85" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="8" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.30 0 0 0 0.055 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#efe6d2"/><stop offset="100%" stop-color="#c9baa0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="72%" r="60%">
      <stop offset="0%" stop-color="#ffe0c8"/><stop offset="55%" stop-color="#ff5a3c"/><stop offset="100%" stop-color="#8c2818" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#vig)" filter="url(#paper)"/>
  <text x="400" y="70" text-anchor="middle" font-family="serif" font-size="40" fill="#3a2c1e" font-style="italic">BRASME</text>
  <text x="400" y="102" text-anchor="middle" font-family="serif" font-size="18" fill="#7a684f" font-style="italic">Vigia · chama vermelho-brasa · o escudo do grupo</text>

  <g transform="translate(400,580)">
    <ellipse cx="0" cy="240" rx="150" ry="22" fill="#3a2c1e" opacity="0.16"/>
    <g filter="url(#ink)">
      <!-- corpo em barril -->
      <path d="M0,-160 C90,-146 116,-64 106,20 C100,90 106,164 90,204 C54,226 -54,226 -90,204 C-106,164 -100,90 -106,20 C-116,-64 -90,-146 0,-160 Z"
            fill="#8c3b2e" stroke="#1a0e08" stroke-width="8"/>
      <!-- placas de bronze rebitadas -->
      <path d="M-96,-30 L-30,-46 L-24,10 L-92,26 Z" fill="#7a5a2e" stroke="#1a0e08" stroke-width="5"/>
      <path d="M24,-46 L92,-30 L94,24 L28,10 Z" fill="#7a5a2e" stroke="#1a0e08" stroke-width="5"/>
      <path d="M-56,40 L58,40 L54,150 C20,166 -20,166 -52,150 Z" fill="#7a5a2e" stroke="#1a0e08" stroke-width="5"/>
      <circle cx="-70" cy="-14" r="4" fill="#4a3018"/><circle cx="-46" cy="-30" r="4" fill="#4a3018"/>
      <circle cx="70" cy="-14" r="4" fill="#4a3018"/><circle cx="46" cy="-30" r="4" fill="#4a3018"/>
      <circle cx="-20" cy="60" r="4" fill="#4a3018"/><circle cx="20" cy="60" r="4" fill="#4a3018"/>
      <circle cx="-30" cy="130" r="4" fill="#4a3018"/><circle cx="30" cy="130" r="4" fill="#4a3018"/>
      <!-- visor semicircular de bronze perfurado -->
      <path d="M-64,-150 C-56,-198 56,-198 64,-150 C30,-166 -30,-166 -64,-150 Z" fill="#4a3018" stroke="#1a0e08" stroke-width="6"/>
      <path d="M-38,-166 L-30,-152 M-14,-172 L-10,-156 M14,-172 L10,-156 M38,-166 L30,-152" stroke="#ff5a3c" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
      <!-- sino embutido no pulso esquerdo -->
      <g transform="translate(-120,60)">
        <path d="M-24,-16 C-24,-40 16,-42 18,-18 C20,-4 8,8 -6,10 C-18,6 -24,-4 -24,-16 Z" fill="#a97b32" stroke="#1a0e08" stroke-width="5"/>
        <circle cx="-6" cy="10" r="3" fill="#1a0e08"/>
      </g>
      <!-- braço direito com Atiçador no suporte -->
      <g transform="translate(122,50) rotate(-16)">
        <rect x="-6" y="0" width="12" height="60" rx="5" fill="#3a2c22" stroke="#1a0e08" stroke-width="4"/>
        <path d="M0,0 C4,-30 20,-42 38,-46" stroke="#c89b52" stroke-width="7" fill="none" stroke-linecap="round"/>
      </g>
    </g>
    <path d="M-40,-176 C-56,-186 -60,-166 -60,-154" fill="none" stroke="#1a0e08" stroke-width="0" opacity="0"/>
    <!-- fenda vermelha (não há rosto visível) -->
    <g transform="translate(0,-170)">
      <path d="M-6,0 C-8,-20 2,-32 4,-36 C10,-24 12,-10 6,2 C4,6 -4,6 -6,0 Z" fill="url(#flame)"/>
    </g>
  </g>
  <text x="400" y="960" text-anchor="middle" font-family="serif" font-size="17" fill="#8a785e" font-style="italic">desenhado à mão e digitalizado (ADR-010) · concept interno · Névora</text>
</svg>
