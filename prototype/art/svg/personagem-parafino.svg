<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="turbulence" baseFrequency="0.014" numOctaves="3" seed="96" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="9" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.30 0 0 0 0.055 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#efe6d2"/><stop offset="100%" stop-color="#c9baa0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="72%" r="60%">
      <stop offset="0%" stop-color="#dff6ff"/><stop offset="55%" stop-color="#2fa8c9"/><stop offset="100%" stop-color="#134b5c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#vig)" filter="url(#paper)"/>
  <text x="400" y="70" text-anchor="middle" font-family="serif" font-size="40" fill="#3a2c1e" font-style="italic">PARAFINO</text>
  <text x="400" y="102" text-anchor="middle" font-family="serif" font-size="18" fill="#7a684f" font-style="italic">Funileiro · chama azul-petróleo · engenhoca e bronze</text>

  <g transform="translate(400,570)">
    <ellipse cx="0" cy="250" rx="130" ry="20" fill="#3a2c1e" opacity="0.14"/>
    <g filter="url(#ink)">
      <!-- tubos de vapor nas costas -->
      <path d="M60,-40 C90,-50 100,-80 92,-108" stroke="#8a6a34" stroke-width="10" fill="none" stroke-linecap="round"/>
      <circle cx="90" cy="-114" r="7" fill="#cfeaf0" opacity="0.7"/>
      <circle cx="104" cy="-128" r="5" fill="#cfeaf0" opacity="0.5"/>
      <!-- corpo remendado assimétrico -->
      <path d="M0,-190 C70,-172 84,-50 74,60 C68,140 74,196 48,224 C18,240 -42,240 -70,224 C-94,196 -88,140 -92,60 C-100,-50 -66,-172 0,-190 Z"
            fill="#5e6b72" stroke="#1a0e08" stroke-width="7"/>
      <!-- placas aparafusadas -->
      <path d="M20,-150 L70,-140 L66,-96 L18,-104 Z" fill="#8a6a34" stroke="#1a0e08" stroke-width="5"/>
      <circle cx="30" cy="-142" r="3.5" fill="#2e2a24"/><circle cx="58" cy="-138" r="3.5" fill="#2e2a24"/>
      <circle cx="26" cy="-108" r="3.5" fill="#2e2a24"/><circle cx="56" cy="-102" r="3.5" fill="#2e2a24"/>
      <!-- válvula de latão -->
      <circle cx="46" cy="-122" r="12" fill="#c9a227" stroke="#1a0e08" stroke-width="4"/>
      <circle cx="46" cy="-122" r="4" fill="#2e2a24"/>
      <!-- lente sobre um olho -->
      <path d="M-30,-24 C-52,-14 -52,10 -30,18" fill="none" stroke="#5a4530" stroke-width="6"/>
      <circle cx="-24" cy="-4" r="22" fill="none" stroke="#8a6a34" stroke-width="6"/>
      <circle cx="-24" cy="-4" r="22" fill="#cfeaf0" opacity="0.35"/>
      <!-- avental -->
      <path d="M-70,50 C-36,38 36,38 70,50 L58,206 C22,220 -22,220 -58,206 Z" fill="#5a4530" stroke="#1a0e08" stroke-width="6"/>
      <rect x="-40" y="100" width="30" height="34" rx="6" fill="#4a3826" stroke="#1a0e08" stroke-width="4"/>
      <rect x="10" y="110" width="26" height="30" rx="6" fill="#4a3826" stroke="#1a0e08" stroke-width="4"/>
      <!-- chave-ferramenta mão esquerda -->
      <g transform="translate(-116,74) rotate(-12)">
        <rect x="-6" y="0" width="12" height="46" rx="5" fill="#8a6a34" stroke="#1a0e08" stroke-width="4"/>
        <path d="M-10,0 L10,0 L6,-14 L-6,-14 Z" fill="#c9a227" stroke="#1a0e08" stroke-width="3"/>
      </g>
      <!-- Atiçador com bocal de solda -->
      <g transform="translate(114,66) rotate(-20)">
        <rect x="-6" y="0" width="12" height="54" rx="5" fill="#3a2c22" stroke="#1a0e08" stroke-width="4"/>
        <path d="M0,0 C4,-26 16,-36 30,-40" stroke="#c89b52" stroke-width="7" fill="none" stroke-linecap="round"/>
        <circle cx="30" cy="-40" r="5" fill="#2fa8c9"/>
      </g>
    </g>
    <g filter="url(#ink)">
      <ellipse cx="-24" cy="-4" rx="7" ry="8" fill="#2fa8c9"/><circle cx="20" cy="-84" r="8" fill="#2fa8c9"/>
    </g>
    <path d="M8,-198 C4,-232 22,-258 28,-264 C40,-244 44,-218 30,-194 C24,-186 12,-188 8,-198 Z" fill="url(#flame)"/>
    <circle cx="40" cy="-236" r="3" fill="#c9a227"/><circle cx="16" cy="-256" r="2.4" fill="#c9a227"/>
  </g>
  <text x="400" y="960" text-anchor="middle" font-family="serif" font-size="17" fill="#8a785e" font-style="italic">desenhado à mão e digitalizado (ADR-010) · concept interno · Névora</text>
</svg>
