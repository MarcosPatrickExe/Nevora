<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="turbulence" baseFrequency="0.014" numOctaves="3" seed="74" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="8"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.38 0 0 0 0 0.30 0 0 0 0.055 0"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#efe6d2"/><stop offset="100%" stop-color="#c9baa0"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="72%" r="60%">
      <stop offset="0%" stop-color="#f4ffd6"/><stop offset="55%" stop-color="#a8e83a"/><stop offset="100%" stop-color="#4f7c1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#vig)" filter="url(#paper)"/>
  <text x="400" y="70" text-anchor="middle" font-family="serif" font-size="40" fill="#3a2c1e" font-style="italic">TURFO</text>
  <text x="400" y="102" text-anchor="middle" font-family="serif" font-size="18" fill="#7a684f" font-style="italic">Coletor · chama verde-lima · alquimia de fronteira</text>

  <g transform="translate(400,580)">
    <ellipse cx="0" cy="250" rx="150" ry="20" fill="#3a2c1e" opacity="0.14"/>
    <g filter="url(#ink)">
      <!-- mochila-cesto atrás -->
      <path d="M40,-100 C120,-90 150,-10 140,90 C134,160 140,210 110,230 L40,230 Z" fill="#8a6a3a" stroke="#2a1c14" stroke-width="7"/>
      <ellipse cx="90" cy="-92" rx="52" ry="20" fill="#6b4d26" stroke="#2a1c14" stroke-width="5"/>
      <!-- corpo largo -->
      <path d="M0,-180 C68,-166 78,-40 70,60 C66,140 68,190 44,220 C16,236 -44,236 -72,220 C-96,190 -94,140 -98,60 C-106,-40 -68,-166 0,-180 Z"
            fill="#d8cbaa" stroke="#2a1c14" stroke-width="7"/>
      <!-- aba de cera sobre os olhos -->
      <path d="M-60,-140 C-20,-158 40,-158 68,-138 C40,-146 -20,-146 -60,-140 Z" fill="#c4b48c" stroke="#2a1c14" stroke-width="5"/>
      <!-- remendos de quitina nos ombros -->
      <path d="M-90,-40 L-58,-64 L-40,-30 L-70,-8 Z" fill="#b57a2e" stroke="#2a1c14" stroke-width="5"/>
      <path d="M60,-50 L92,-70 L108,-38 L78,-14 Z" fill="#b57a2e" stroke="#2a1c14" stroke-width="5"/>
      <!-- avental -->
      <path d="M-56,20 C-30,10 30,10 56,20 L48,190 C20,204 -20,204 -48,190 Z" fill="#6b5138" stroke="#2a1c14" stroke-width="6"/>
      <!-- frascos pendurados -->
      <g stroke="#2a1c14" stroke-width="3">
        <circle cx="-70" cy="130" r="14" fill="#d5e86a" opacity="0.85"/>
        <circle cx="-40" cy="150" r="12" fill="#7a5a30" opacity="0.85"/>
        <circle cx="76" cy="140" r="13" fill="#9fb8ff" opacity="0.7"/>
        <circle cx="46" cy="158" r="10" fill="#efe3cb" opacity="0.5"/>
      </g>
      <!-- podão mão direita -->
      <g transform="translate(-116,60) rotate(200)">
        <rect x="-6" y="0" width="12" height="70" rx="5" fill="#6b4226" stroke="#2a1c14" stroke-width="4"/>
        <path d="M0,0 C24,-6 42,-22 44,-42 C24,-38 8,-24 0,0 Z" fill="#b57a2e" stroke="#2a1c14" stroke-width="4"/>
      </g>
      <!-- frasco-lanterna mão esquerda -->
      <g transform="translate(108,64)">
        <rect x="-16" y="-10" width="32" height="44" rx="8" fill="#d5e86a" opacity="0.6" stroke="#2a1c14" stroke-width="5"/>
        <circle cx="0" cy="8" r="8" fill="#a8e83a"/>
      </g>
    </g>
    <g filter="url(#ink)">
      <circle cx="-16" cy="-96" r="8" fill="#a8e83a"/><circle cx="14" cy="-96" r="8" fill="#a8e83a"/>
    </g>
    <!-- chama baixa, protegida por meia-cúpula -->
    <g transform="translate(0,-178)">
      <path d="M-24,10 C-30,-6 -14,-14 0,-14 C14,-14 30,-6 24,10 Z" fill="#8d919b" opacity="0.5" stroke="#2a1c14" stroke-width="4"/>
      <path d="M-8,0 C-10,-14 0,-24 2,-28 C10,-18 12,-6 4,4 C0,8 -6,6 -8,0 Z" fill="url(#flame)"/>
    </g>
  </g>
  <text x="400" y="960" text-anchor="middle" font-family="serif" font-size="17" fill="#8a785e" font-style="italic">desenhado à mão e digitalizado (ADR-010) · concept interno · Névora</text>
</svg>
